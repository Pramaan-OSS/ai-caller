[project]
name = "ai-caller"
version = "0.1.0"
description = "Phone agents that run on Pramaan."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
include = ["ai_caller*"]

[tool.setuptools.package-data]
ai_caller = ["static/*", "static/fonts/*"]
